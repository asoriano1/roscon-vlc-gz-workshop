# Controladores del RB-Kairos+ para el taller (solo para este taller).
# Mismo robot y mismo hardware interface (cuatro ruedas con interfaz de velocidad) que el
# original de Robotnik; cambia el controlador: diff_drive_controller en modo skid-steer, que es
# público y ya está en la imagen, en vez de robotnik_controllers/RBKairosController. Sus ruedas
# son mecanum: así avanza y gira, pero no se desplaza de lado. El brazo no está en ros2_control.
# Lo carga setup/rbkairos/rbkairos_control.urdf.xacro (ver Dockerfile).
#
# Los nombres de joints van SIN prefijo: importa el RB-Kairos+ con el campo "prefix" vacío.
# Geometría sacada del URDF expandido (rbkairos_plus.urdf.xacro):
#   ruedas en x = ±0.21528, y = ±0.259 → separación 0.518 m; radio de rueda 0.127 m
/**:
  controller_manager:
    ros__parameters:
      update_rate: 50  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

  diff_drive_controller:
    ros__parameters:
      left_wheel_names: ["front_left_wheel_joint", "back_left_wheel_joint"]
      right_wheel_names: ["front_right_wheel_joint", "back_right_wheel_joint"]

      # Separación geométrica. En skid-steer el giro real patina y sale más lento que lo
      # pedido; para el taller basta con que gire.
      wheel_separation: 0.518
      wheel_radius: 0.127

      publish_rate: 50.0
      odom_frame_id: odom
      base_frame_id: base_footprint
      enable_odom_tf: true
      open_loop: false

      linear.x.max_velocity: 1.0
      linear.x.min_velocity: -1.0
      linear.x.max_acceleration: 1.0
      angular.z.max_velocity: 1.5
      angular.z.min_velocity: -1.5
      angular.z.max_acceleration: 2.0
