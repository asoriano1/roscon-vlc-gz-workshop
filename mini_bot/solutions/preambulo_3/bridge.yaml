# Puente Gazebo ↔ ROS 2 para mini_bot.
#
# Cada entrada copia un topic de un lado a otro: los dos nombres, los dos tipos y la dirección.
# Los nombres de Gazebo son los del <topic> de cada <sensor> del xacro (gz topic -l los lista).
# Son nombres absolutos (/scan): este fichero vale para un robot sin namespace.
#
# El reloj ya está activo: sin /clock en ROS 2, los nodos con use_sim_time se quedan en el
# instante 0.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# PASO 9: el LiDAR, la cámara y la información de calibración de la cámara. Descomenta las
# tres entradas (selecciónalas y Ctrl+/ en la mayoría de editores).
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

